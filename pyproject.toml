[project]
name = "ti"
version = "0.1.0"
description = "Traceable Insight: cited motor-skill insight and meet selection for Project Champion"
authors = [
    { name = "AvAdiii", email = "theavaditya@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jellyfish>=1.2.1",
    "pandas>=3.0.6",
    "pyyaml>=6.0.3",
    "rapidfuzz>=3.14.6",
    "openpyxl>=3.1",
    "sqlalchemy>=2.0",
    "pyjwt>=2.8",
    "python-multipart>=0.0.9",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
hosted = ["psycopg[binary]>=3.2"]

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "playwright>=1.64.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = ["ollama: needs a running Ollama server with the configured model"]
