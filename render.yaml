# Render blueprint. Set TI_DATABASE_URL to the Supabase Postgres connection string
# (postgresql+psycopg://...), and TI_SECRET to a long random value.
services:
  - type: web
    name: traceable-insight
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: TI_DATABASE_URL
        sync: false
      - key: TI_SECRET
        generateValue: true
      - key: TI_CORS
        value: ""
